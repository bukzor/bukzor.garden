<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tic-Tac-Toe</title>
    <link data-trunk rel="css" href="style.css" />
    <link data-trunk rel="rust" href="." data-wasm-opt="z" />
</head>
<body>
<div class="controls">
    <label><input type="checkbox" id="auto-x"> Auto X</label>
    <label><input type="checkbox" id="auto-o"> Auto O</label>
    <label>Delay: <input type="number" id="delay" value="1500" min="0" max="5000" style="width: 60px">ms</label>
</div>
<footer class="support">
    <p class="support-pitch">Support this game</p>
    <div class="support-buttons">
        <a class="support-button" href="https://donate.stripe.com/dRm3co3Zi6jfeV6ar81Nu00">Chip in</a>
    </div>
    <p class="support-note">Card fees take a flat 30 cents per charge, so one larger gift goes further than many small ones.</p>
</footer>
<script type="module">
    addEventListener("TrunkApplicationStarted", () => {
        window.app = new window.wasmBindings.App(document);
    });
</script>
</body>
</html>
